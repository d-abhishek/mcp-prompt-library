[project]
name = "mcp-prompt-library"
version = "0.1.0"
description = "MCP server for managing and using reusable prompts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.10.1",
    "python-frontmatter>=1.1.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "fastmcp>=2.12.4",
    "uvicorn[standard]",
    "python-dotenv",
]

[tool.setuptools]
include-package-data = true

# Only treat 'server' and 'prompts' as Python packages
[tool.setuptools.packages.find]
where = ["."]
include = ["server", "server.*", "prompts", "prompts.*"]
exclude = ["tests*", "docs*", "data*", "venv*", "build*", "dist*"]

# Ship non-.py files alongside those packages
[tool.setuptools.package-data]
prompts = ["*.md", "**/*.md", "*.yaml", "*.yml", "*.json"]
server  = ["*.md", "**/*.md", "*.yaml", "*.yml", "*.json"]

# OPTIONAL: install your 'data/setup_work_environment' markdowns as data files
# They will land under: site-packages/mcp_prompt_library_data/setup_work_environment/
[tool.setuptools.data-files]
"mcp_prompt_library_data/setup_work_environment" = [
  "data/setup_work_environment/*.md"
]
